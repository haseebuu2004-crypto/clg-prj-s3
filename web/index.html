<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skill Swap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="A warm campus community for sharing what you know and learning from one another.">
  <title>Skill Swap | Learn together</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" data-page="dashboard" aria-label="Skill Swap dashboard">
        <span class="brand-mark">S</span>
        <span><strong>SKILL SWAP</strong><small>Learn from each other</small></span>
      </a>
      <nav class="side-nav">
        <button data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button data-page="matches"><span class="nav-icon">✦</span>Find partners</button>
        <button data-page="skills"><span class="nav-icon">▤</span>My skills</button>
        <button data-page="sessions"><span class="nav-icon">◷</span>Sessions</button>
        <button data-page="profile"><span class="nav-icon">◎</span>Profile &amp; join</button>
      </nav>
      <div class="sidebar-note"><strong>COLLEGE DEMO</strong><p>Your profiles and sessions are saved on this device.</p></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-leading">
          <button class="mobile-menu-toggle" type="button" data-action="toggle-mobile-menu" aria-label="Open navigation menu" aria-controls="mobile-menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="topbar-title"><span class="eyebrow">CAMPUS COMMUNITY</span><strong id="page-title">Dashboard</strong></div>
        </div>
        <div class="topbar-tools"><span class="save-state" id="save-state"><i></i>Saved on this device</span><label class="profile-picker"><span class="sr-only">Active student profile</span><select id="profile-picker"></select></label></div>
      </header>
      <main id="main-content" tabindex="-1"></main>
      <footer class="app-footer">Skill Swap <span>·</span> Learn together, grow together</footer>
    </div>
  </div>

  <div id="mobile-menu-layer" class="mobile-menu-layer" hidden>
    <button class="mobile-menu-backdrop" type="button" data-action="close-mobile-menu" aria-label="Close navigation menu"></button>
    <nav id="mobile-menu" class="mobile-menu" aria-label="Main navigation">
      <div class="mobile-menu-heading"><span class="brand-mark">S</span><span><strong>SKILL SWAP</strong><small>Learn from each other</small></span><button class="mobile-menu-close" type="button" data-action="close-mobile-menu" aria-label="Close navigation menu">×</button></div>
      <div class="mobile-menu-items">
        <button data-page="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button data-page="matches"><span class="nav-icon">✦</span><span>Find partners</span></button>
        <button data-page="skills"><span class="nav-icon">▤</span><span>My skills</span></button>
        <button data-page="sessions"><span class="nav-icon">◷</span><span>Sessions</span></button>
        <button data-page="profile"><span class="nav-icon">◎</span><span>Profile &amp; join</span></button>
      </div>
      <p class="mobile-menu-note">Profiles and sessions are saved on this device.</p>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="dialog-root"></div>
</body>
</html>
